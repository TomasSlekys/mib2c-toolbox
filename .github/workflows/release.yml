# On a version tag (v1.2.3), or by hand (Actions › release › Run workflow, choosing a tag): zip the card folder's
# contents and publish them as a GitHub release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Zip the card
        run: |
          cd card
          # The empty folder for the user's edited files (git keeps no empty folders).
          mkdir -p mib2cfg/skin0
          chmod +x toolbox.sh mib2cfg/mib2cfg.sh mib2cfg/greenmenu/scripts/*.sh
          zip -r -X "../mib2c-toolbox-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          files: mib2c-toolbox-${{ github.ref_name }}.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
